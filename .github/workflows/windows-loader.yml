name: Windows Loader

on:
  push:
    paths:
      - "windows/**"
      - "packages/bennett-ui-improvements/**"
      - "src/settings-host.mjs"
      - "Directory.Build.props"
      - "global.json"
      - "NuGet.Config"
      - ".github/workflows/windows-loader.yml"
  pull_request:
    paths:
      - "windows/**"
      - "packages/bennett-ui-improvements/**"
      - "src/settings-host.mjs"
      - "Directory.Build.props"
      - "global.json"
      - "NuGet.Config"
      - ".github/workflows/windows-loader.yml"

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "windows/**/packages.lock.json"
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore windows/CodexScriptLoader.Windows.sln --configfile NuGet.Config --locked-mode
      - name: Build
        shell: pwsh
        run: dotnet build windows/CodexScriptLoader.Windows.sln -c Release --no-restore
      - name: Run native self-tests
        shell: pwsh
        run: dotnet run --project windows/tests/CodexScriptLoader.Tests/CodexScriptLoader.Tests.csproj -c Release --no-build
      - name: Verify reproducible pre-sign payload
        shell: pwsh
        run: ./windows/scripts/verify-reproducible.ps1 -RuntimeIdentifier ${{ matrix.runtime }}
      - name: Package latest build
        shell: pwsh
        run: ./windows/scripts/package.ps1 -RuntimeIdentifier ${{ matrix.runtime }}
      - name: Verify package structure and GUI subsystem
        shell: pwsh
        run: ./windows/scripts/verify-package.ps1 -PackagePath bin/CodexScriptLoader-0.3.0.0-${{ matrix.runtime == 'win-x64' && 'x64' || 'arm64' }}.msix -Architecture ${{ matrix.runtime == 'win-x64' && 'x64' || 'arm64' }}
      - name: Upload unsigned development package
        uses: actions/upload-artifact@v4
        with:
          name: codex-script-loader-${{ matrix.runtime }}-unsigned
          path: bin/*.msix
          if-no-files-found: error
