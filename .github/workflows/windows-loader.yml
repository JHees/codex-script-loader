name: Windows Loader

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "windows/**"
      - "packages/example-ui-plugin/**"
      - "src/settings-host.mjs"
      - "Directory.Build.props"
      - "global.json"
      - "NuGet.Config"
      - ".github/workflows/windows-loader.yml"

permissions:
  contents: read

concurrency:
  group: windows-loader-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-test-package:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "windows/**/packages.lock.json"
      - name: Install pinned NSIS
        shell: pwsh
        run: choco install nsis --version=3.12.0 -y --no-progress
      - name: Validate synchronized versions
        shell: pwsh
        run: |
          $productVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($productVersion -notmatch '^\d+\.\d+\.\d+$') { throw "package.json version is not semantic: $productVersion" }

          [xml]$buildProps = Get-Content -LiteralPath Directory.Build.props -Raw
          $propsVersion = [string]$buildProps.Project.PropertyGroup.Version
          if ($propsVersion -ne $productVersion) { throw "Directory.Build.props version $propsVersion does not match $productVersion." }

          [xml]$windowsProject = Get-Content -LiteralPath windows/src/CodexScriptLoader.Windows/CodexScriptLoader.Windows.csproj -Raw
          $applicationVersion = [string]$windowsProject.Project.PropertyGroup.ApplicationVersion
          if ($applicationVersion -ne "$productVersion.0") { throw "ApplicationVersion $applicationVersion does not match $productVersion.0." }

          [xml]$launcherProject = Get-Content -LiteralPath windows/src/CodexScriptLoader.Launcher/CodexScriptLoader.Launcher.csproj -Raw
          $launcherApplicationVersion = [string]$launcherProject.Project.PropertyGroup.ApplicationVersion
          if ($launcherApplicationVersion -ne "$productVersion.0") { throw "Launcher ApplicationVersion $launcherApplicationVersion does not match $productVersion.0." }

          "PRODUCT_VERSION=$productVersion" >> $env:GITHUB_ENV
      - name: Validate NSIS installer contract
        shell: pwsh
        run: |
          $script = Get-Content -LiteralPath windows/packaging/CodexScriptLoader.nsi -Raw
          $requiredPages = @(
            'MUI_PAGE_WELCOME',
            'MUI_PAGE_DIRECTORY',
            'MUI_PAGE_STARTMENU',
            'MUI_PAGE_INSTFILES',
            'MUI_PAGE_FINISH'
          )
          foreach ($page in $requiredPages) {
            if ($script -notmatch [regex]::Escape($page)) { throw "Required NSIS page is missing: $page" }
          }
          if ($script -match 'MUI_PAGE_COMPONENTS') { throw "The installer must not contain an empty components page." }
          if ($script -notmatch 'RequestExecutionLevel user') { throw "The installer must remain per-user and non-elevated." }
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore windows/CodexScriptLoader.Windows.sln --configfile NuGet.Config --locked-mode
      - name: Build
        shell: pwsh
        run: dotnet build windows/CodexScriptLoader.Windows.sln -c Release --no-restore -m:1 -p:BuildInParallel=false -p:UseSharedCompilation=false
      - name: Run native self-tests
        shell: pwsh
        run: dotnet run --project windows/tests/CodexScriptLoader.Tests/CodexScriptLoader.Tests.csproj -c Release --no-build
      - name: Verify reproducible application payload
        shell: pwsh
        run: ./windows/scripts/verify-reproducible.ps1 -RuntimeIdentifier ${{ matrix.runtime }} -Version $env:PRODUCT_VERSION
      - name: Build NSIS installer and portable archive
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "package/${{ matrix.runtime }}"
          ./windows/scripts/package.ps1 -RuntimeIdentifier "${{ matrix.runtime }}" -Version $env:PRODUCT_VERSION -OutputRoot $outputRoot
      - name: Verify installer, portable archive, SBOM, and checksums
        shell: pwsh
        env:
          PACKAGE_ARCHITECTURE: ${{ matrix.runtime == 'win-x64' && 'x64' || 'arm64' }}
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "package/${{ matrix.runtime }}"
          ./windows/scripts/verify-package.ps1 -ArtifactRoot $outputRoot -Version $env:PRODUCT_VERSION -Architecture $env:PACKAGE_ARCHITECTURE
      - name: Test stable launcher health fallback
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "package/${{ matrix.runtime }}"
          ./windows/scripts/test-launcher.ps1 -ArtifactRoot $outputRoot -Version $env:PRODUCT_VERSION
      - name: Test standard-user silent install and uninstall
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "package/${{ matrix.runtime }}"
          ./windows/scripts/test-installer.ps1 -ArtifactRoot $outputRoot -Version $env:PRODUCT_VERSION
      - name: Upload public Windows package
        uses: actions/upload-artifact@v4
        with:
          name: codex-script-loader-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/package/${{ matrix.runtime }}/CodexScriptLoader-*-setup.exe
            ${{ runner.temp }}/package/${{ matrix.runtime }}/CodexScriptLoader-*.zip
            ${{ runner.temp }}/package/${{ matrix.runtime }}/CodexScriptLoader-*.sha256
          if-no-files-found: error
      - name: Retain SBOM as CI metadata
        uses: actions/upload-artifact@v4
        with:
          name: internal-sbom-${{ matrix.runtime }}
          path: ${{ runner.temp }}/package/${{ matrix.runtime }}/CodexScriptLoader-*.spdx.json
          if-no-files-found: error
          retention-days: 30

  release_metadata:
    if: github.ref_type == 'tag'
    runs-on: windows-2025
    outputs:
      product_version: ${{ steps.version.outputs.product_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $productVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$productVersion") { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $productVersion." }
          "product_version=$productVersion" >> $env:GITHUB_OUTPUT

  publish_release:
    if: github.ref_type == 'tag'
    needs: [build-test-package, release_metadata]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: codex-script-loader-win-*
          path: release-payload
          merge-multiple: true
      - name: Validate per-package SHA-256 files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.product_version }}
        run: |
          $files = @(Get-ChildItem -LiteralPath release-payload -File | Sort-Object Name)
          $expectedNames = @(
            "CodexScriptLoader-$env:RELEASE_VERSION-windows-x64-setup.exe",
            "CodexScriptLoader-$env:RELEASE_VERSION-windows-x64-setup.exe.sha256",
            "CodexScriptLoader-$env:RELEASE_VERSION-windows-x64.zip",
            "CodexScriptLoader-$env:RELEASE_VERSION-windows-x64.zip.sha256",
            "CodexScriptLoader-$env:RELEASE_VERSION-windows-arm64-setup.exe",
            "CodexScriptLoader-$env:RELEASE_VERSION-windows-arm64-setup.exe.sha256",
            "CodexScriptLoader-$env:RELEASE_VERSION-windows-arm64.zip",
            "CodexScriptLoader-$env:RELEASE_VERSION-windows-arm64.zip.sha256"
          ) | Sort-Object
          $actualNames = @($files.Name | Sort-Object)
          if (($actualNames -join "`n") -ne ($expectedNames -join "`n")) {
            throw "Release assets do not match the expected four packages and four checksum files. Actual: $($actualNames -join ', ')"
          }
          foreach ($package in @($files | Where-Object { $_.Name -notlike '*.sha256' })) {
            $checksumPath = "$($package.FullName).sha256"
            $lines = @(Get-Content -LiteralPath $checksumPath -Encoding ascii)
            if ($lines.Count -ne 1 -or $lines[0] -notmatch '^([0-9a-fA-F]{64})  (.+)$' -or $Matches[2] -cne $package.Name) {
              throw "Malformed checksum file: $($package.Name).sha256"
            }
            $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
            if ($Matches[1].ToLowerInvariant() -ne $actualHash) { throw "SHA-256 mismatch for $($package.Name)" }
          }
      - name: Create release summary
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.product_version }}
        run: |
          $baseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:RELEASE_VERSION"
          function Get-PackageHash([string]$Name) {
            $line = (Get-Content -LiteralPath "release-payload/$Name.sha256" -Raw -Encoding ascii).Trim()
            $match = [regex]::Match($line, '^([0-9a-fA-F]{64})  (.+)$')
            if (-not $match.Success -or $match.Groups[2].Value -cne $Name) { throw "Invalid checksum for $Name" }
            return $match.Groups[1].Value.ToLowerInvariant()
          }
          $x64Setup = "CodexScriptLoader-$env:RELEASE_VERSION-windows-x64-setup.exe"
          $x64Zip = "CodexScriptLoader-$env:RELEASE_VERSION-windows-x64.zip"
          $arm64Setup = "CodexScriptLoader-$env:RELEASE_VERSION-windows-arm64-setup.exe"
          $arm64Zip = "CodexScriptLoader-$env:RELEASE_VERSION-windows-arm64.zip"
          $x64SetupHash = Get-PackageHash $x64Setup
          $x64ZipHash = Get-PackageHash $x64Zip
          $arm64SetupHash = Get-PackageHash $arm64Setup
          $arm64ZipHash = Get-PackageHash $arm64Zip
          @"
          ## Downloads

          | Windows architecture | Installer | Portable |
          | --- | --- | --- |
          | x64 | [Setup EXE]($baseUrl/CodexScriptLoader-$env:RELEASE_VERSION-windows-x64-setup.exe) | [Portable ZIP]($baseUrl/CodexScriptLoader-$env:RELEASE_VERSION-windows-x64.zip) |
          | Arm64 | [Setup EXE]($baseUrl/CodexScriptLoader-$env:RELEASE_VERSION-windows-arm64-setup.exe) | [Portable ZIP]($baseUrl/CodexScriptLoader-$env:RELEASE_VERSION-windows-arm64.zip) |

          Most Windows PCs use the **x64 installer**. Portable ZIPs are intended for manual use; automatic Loader updates use the matching ZIP internally.

          ## Verification

          Each package has a separate ``.sha256`` verification file. The same digests are listed here for convenience:

          | Package | SHA-256 |
          | --- | --- |
          | ``$x64Setup`` | ``$x64SetupHash`` |
          | ``$x64Zip`` | ``$x64ZipHash`` |
          | ``$arm64Setup`` | ``$arm64SetupHash`` |
          | ``$arm64Zip`` | ``$arm64ZipHash`` |

          Release binaries are currently not Authenticode-signed.
          "@ | Set-Content -LiteralPath release-summary.md -Encoding utf8NoBOM
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.product_version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              case "$asset" in
                "CodexScriptLoader-$RELEASE_VERSION-windows-x64-setup.exe"|\
                "CodexScriptLoader-$RELEASE_VERSION-windows-x64-setup.exe.sha256"|\
                "CodexScriptLoader-$RELEASE_VERSION-windows-x64.zip"|\
                "CodexScriptLoader-$RELEASE_VERSION-windows-x64.zip.sha256"|\
                "CodexScriptLoader-$RELEASE_VERSION-windows-arm64-setup.exe"|\
                "CodexScriptLoader-$RELEASE_VERSION-windows-arm64-setup.exe.sha256"|\
                "CodexScriptLoader-$RELEASE_VERSION-windows-arm64.zip"|\
                "CodexScriptLoader-$RELEASE_VERSION-windows-arm64.zip.sha256") ;;
                *) gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY" ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' --repo "$GITHUB_REPOSITORY")
            gh release upload "$RELEASE_TAG" release-payload/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-payload/* --verify-tag --generate-notes --notes-file release-summary.md --title "Codex Script Loader v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY"
          fi
